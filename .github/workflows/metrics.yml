name: GitHub Metrics

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  github-metrics:
    runs-on: ubuntu-latest

    steps:
      # LEFT — Isometric Commit Calendar
      - name: Generate Isometric Calendar
        uses: lowlighter/metrics@latest
        with:
          user: ThitipongSaysood
          token: ${{ secrets.METRICS_TOKEN }}
          filename: metrics-calendar.svg
          base: ""
          config_timezone: Asia/Bangkok

          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year

      # RIGHT — Languages Activity
      - name: Generate Languages Activity
        uses: lowlighter/metrics@latest
        with:
          user: ThitipongSaysood
          token: ${{ secrets.METRICS_TOKEN }}
          filename: metrics-languages.svg
          base: ""
          config_timezone: Asia/Bangkok

          plugin_languages: yes
          plugin_languages_sections: most-used
          plugin_languages_indepth: yes
          plugin_languages_details: lines, bytes-size, percentage
          plugin_languages_limit: 8
          plugin_languages_other: yes
          plugin_languages_threshold: 0%
          plugin_languages_analysis_timeout: 15

          commits_authoring: |
            ThitipongSaysood
            arm.thitipong1994@gmail.com
